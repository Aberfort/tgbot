services:
  tg-rewriter-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-rewriter-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./logs:/app/logs
      - ./prompts:/app/prompts:ro
    stdin_open: true
    tty: true
